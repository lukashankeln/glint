apiVersion: "v1"
kind: "Pod"
metadata:
  name: "priv-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
      securityContext:
        privileged: true
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "priv-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "priv"
  template:
    metadata:
      labels:
        app: "priv"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
          securityContext:
            privileged: true
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "priv-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
              securityContext:
                privileged: true
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "init-priv-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
