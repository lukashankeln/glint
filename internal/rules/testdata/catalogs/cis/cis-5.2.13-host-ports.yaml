apiVersion: "v1"
kind: "Pod"
metadata:
  name: "hostport-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
      ports:
        - containerPort: 80
          hostPort: 8080
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "hostport-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "hostport"
  template:
    metadata:
      labels:
        app: "hostport"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
          ports:
            - containerPort: 80
              hostPort: 8080
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "hostport-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
              ports:
                - containerPort: 80
                  hostPort: 8080
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "init-hostport-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  initContainers:
    - name: "init"
      image: "nginx:1.27"
      ports:
        - containerPort: 81
          hostPort: 81
---
apiVersion: "apps/v1"
kind: "Deployment"
