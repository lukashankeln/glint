            - containerPort: 81
              hostPort: 81
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "init-hostport-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
