apiVersion: "v1"
kind: "Pod"
metadata:
  name: "add-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
      securityContext:
        capabilities:
          add:
            - "NET_ADMIN"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "add-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "add"
  template:
    metadata:
      labels:
        app: "add"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
          securityContext:
            capabilities:
              add:
                - "NET_ADMIN"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "add-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
              securityContext:
                capabilities:
                  add:
                    - "NET_ADMIN"
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "init-add-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  initContainers:
    - name: "init"
      image: "nginx:1.27"
      securityContext:
        capabilities:
          add:
            - "SYS_TIME"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "init-add-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "init-add"
  template:
    metadata:
      labels:
        app: "init-add"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
      initContainers:
        - name: "init"
          image: "nginx:1.27"
          securityContext:
            capabilities:
              add:
                - "SYS_TIME"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "init-add-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          initContainers:
            - name: "init"
              image: "nginx:1.27"
              securityContext:
                capabilities:
                  add:
                    - "SYS_TIME"
          restartPolicy: "OnFailure"
---
