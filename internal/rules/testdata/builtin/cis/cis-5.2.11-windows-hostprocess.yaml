apiVersion: "v1"
kind: "Pod"
metadata:
  name: "pod-level-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  securityContext:
    windowsOptions:
      hostProcess: true
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "pod-level-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "pod-level"
  template:
    metadata:
      labels:
        app: "pod-level"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
      securityContext:
        windowsOptions:
          hostProcess: true
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "pod-level-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          securityContext:
            windowsOptions:
              hostProcess: true
          restartPolicy: "OnFailure"
---
