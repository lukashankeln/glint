apiVersion: "v1"
kind: "Pod"
metadata:
  name: "no-sc-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "no-sc-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "no-sc"
  template:
    metadata:
      labels:
        app: "no-sc"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "no-sc-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          restartPolicy: "OnFailure"
---
