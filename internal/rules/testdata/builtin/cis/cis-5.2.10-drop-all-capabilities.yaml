apiVersion: "v1"
kind: "Pod"
metadata:
  name: "no-caps-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "no-caps-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "no-caps"
  template:
    metadata:
      labels:
        app: "no-caps"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "no-caps-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "null-caps-pod"
