apiVersion: "v1"
kind: "Pod"
metadata:
  name: "secret-key-ref-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
      env:
        - name: "PW"
          valueFrom:
            secretKeyRef:
              name: "db"
              key: "pw"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "secret-key-ref-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "secret-key-ref"
  template:
    metadata:
      labels:
        app: "secret-key-ref"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
          env:
            - name: "PW"
              valueFrom:
                secretKeyRef:
                  name: "db"
                  key: "pw"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "secret-key-ref-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
              env:
                - name: "PW"
                  valueFrom:
                    secretKeyRef:
                      name: "db"
                      key: "pw"
          restartPolicy: "OnFailure"
---
