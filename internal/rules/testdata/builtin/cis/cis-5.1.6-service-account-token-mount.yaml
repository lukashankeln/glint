apiVersion: "v1"
kind: "Pod"
metadata:
  name: "absent-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "absent-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "absent"
  template:
    metadata:
      labels:
        app: "absent"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "absent-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "true-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  automountServiceAccountToken: true
---
