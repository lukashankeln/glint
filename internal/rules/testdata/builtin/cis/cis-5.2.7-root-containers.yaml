apiVersion: "v1"
kind: "Pod"
metadata:
  name: "nothing-set-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "nothing-set-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "nothing-set"
  template:
    metadata:
      labels:
        app: "nothing-set"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "nothing-set-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          restartPolicy: "OnFailure"
---
