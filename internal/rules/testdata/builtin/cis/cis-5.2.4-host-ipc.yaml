apiVersion: "v1"
kind: "Pod"
metadata:
  name: "on-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  hostIPC: true
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "on-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "on"
  template:
    metadata:
      labels:
        app: "on"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
      hostIPC: true
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "on-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          hostIPC: true
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
