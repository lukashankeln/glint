apiVersion: "v1"
kind: "Pod"
metadata:
  name: "none-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "none-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "none"
  template:
    metadata:
      labels:
        app: "none"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "none-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "both-null-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
