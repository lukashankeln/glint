apiVersion: "v1"
kind: "Pod"
metadata:
  name: "hostpath-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  volumes:
    - name: "logs"
      hostPath:
        path: "/var/log"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "hostpath-deploy"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "hostpath"
  template:
    metadata:
      labels:
        app: "hostpath"
    spec:
      containers:
        - name: "app"
          image: "nginx:1.27"
      volumes:
        - name: "logs"
          hostPath:
            path: "/var/log"
---
apiVersion: "batch/v1"
kind: "CronJob"
metadata:
  name: "hostpath-cron"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: "app"
              image: "nginx:1.27"
          volumes:
            - name: "logs"
              hostPath:
                path: "/var/log"
          restartPolicy: "OnFailure"
---
apiVersion: "v1"
kind: "Pod"
metadata:
  name: "hostpath-second-pod"
  namespace: "prod"
  labels:
    glint.test/expect: "violation"
spec:
  containers:
    - name: "app"
      image: "nginx:1.27"
  volumes:
    - name: "tmp"
      emptyDir: {}
    - name: "sock"
      hostPath:
        path: "/var/run/docker.sock"
        type: "Socket"
---
