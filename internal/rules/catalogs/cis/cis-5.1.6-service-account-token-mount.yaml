id: cis-5.1.6-service-account-token-mount
description: "CIS 5.1.6: Ensure that Service Account Tokens are only mounted where necessary"
severity: info
on_eval_error: error
match:
  kinds:
    - Pod
    - Deployment
    - StatefulSet
    - DaemonSet
    - ReplicaSet
    - ReplicationController
    - Job
    - CronJob
expression: |
  (has(podSpec(resource).automountServiceAccountToken) && podSpec(resource).automountServiceAccountToken != null && podSpec(resource).automountServiceAccountToken == false)
message: "{{ .kind }}/{{ .name }} does not set automountServiceAccountToken: false in its pod spec"
