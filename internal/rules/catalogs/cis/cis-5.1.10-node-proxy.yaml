id: cis-5.1.10-node-proxy
description: "CIS 5.1.10: Minimize access to the proxy sub-resource of nodes"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.resources) && r.resources != null) && ["nodes/proxy", "*/proxy", "*"].exists(x, x in r.resources)) &&
      (has(r.verbs) && r.verbs != null) && size(r.verbs) > 0))
message: "{{ .kind }}/{{ .name }} grants access to the nodes/proxy sub-resource"
