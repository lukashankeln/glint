id: cis-5.1.11-csr-approval
description: "CIS 5.1.11: Minimize access to the approval sub-resource of certificatesigningrequests objects"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.resources) && r.resources != null) && ["certificatesigningrequests/approval", "*"].exists(x, x in r.resources)) &&
      ((has(r.verbs) && r.verbs != null) && ["update", "patch", "*"].exists(x, x in r.verbs))))
message: "{{ .kind }}/{{ .name }} grants access to the certificatesigningrequests/approval sub-resource"
