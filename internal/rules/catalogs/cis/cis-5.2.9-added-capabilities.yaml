id: cis-5.2.9-added-capabilities
description: "CIS 5.2.9: Minimize the admission of containers with added capabilities"
severity: warning
on_eval_error: error
match:
  kinds:
    - Pod
    - Deployment
    - StatefulSet
    - DaemonSet
    - ReplicaSet
    - ReplicationController
    - Job
    - CronJob
expression: |
  podContainers(resource).all(c, !(has(c.securityContext) && c.securityContext != null && has(c.securityContext.capabilities) && c.securityContext.capabilities != null && has(c.securityContext.capabilities.add) && c.securityContext.capabilities.add != null && c.securityContext.capabilities.add .size() > 0))
message: "{{ .kind }}/{{ .name }} has a container with added capabilities"
