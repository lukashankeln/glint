id: cis-5.2.5-host-network
description: "CIS 5.2.5: Minimize the admission of containers wishing to share the host network namespace"
severity: error
on_eval_error: error
match:
  kinds:
    - Pod
    - Deployment
    - StatefulSet
    - DaemonSet
    - ReplicaSet
    - ReplicationController
    - Job
    - CronJob
expression: |
  !(has(podSpec(resource).hostNetwork) && podSpec(resource).hostNetwork != null && podSpec(resource).hostNetwork == true)
message: "{{ .kind }}/{{ .name }} shares the host network namespace (hostNetwork)"
