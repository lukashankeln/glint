id: cis-5.1.13-service-account-token-creation
description: "CIS 5.1.13: Minimize access to the service account token creation"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.resources) && r.resources != null) && ["serviceaccounts/token", "*/token", "*"].exists(x, x in r.resources)) &&
      ((has(r.verbs) && r.verbs != null) && ["create", "*"].exists(x, x in r.verbs))))
message: "{{ .kind }}/{{ .name }} grants permission to create service account tokens"
