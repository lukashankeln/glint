id: cis-5.1.12-webhook-configurations
description: "CIS 5.1.12: Minimize access to webhook configuration objects"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.resources) && r.resources != null) && ["validatingwebhookconfigurations", "mutatingwebhookconfigurations", "*"].exists(x, x in r.resources)) &&
      ((has(r.verbs) && r.verbs != null) && ["create", "update", "patch", "delete", "*"].exists(x, x in r.verbs))))
message: "{{ .kind }}/{{ .name }} grants write access to webhook configuration objects"
