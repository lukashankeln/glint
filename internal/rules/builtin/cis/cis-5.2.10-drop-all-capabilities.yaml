id: cis-5.2.10-drop-all-capabilities
description: "CIS 5.2.10: Minimize the admission of containers with capabilities assigned"
severity: info
on_eval_error: error
match:
  kinds:
    - Pod
    - Deployment
    - StatefulSet
    - DaemonSet
    - ReplicaSet
    - ReplicationController
    - Job
    - CronJob
expression: |
  podContainers(resource).all(c, (has(c.securityContext) && c.securityContext != null && has(c.securityContext.capabilities) && c.securityContext.capabilities != null && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop != null && c.securityContext.capabilities.drop.exists(x, x == "ALL")))
message: "{{ .kind }}/{{ .name }} has a container that does not drop ALL capabilities"
