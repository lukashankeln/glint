id: cis-5.4.1-secrets-as-env
description: "CIS 5.4.1: Prefer using Secrets as files over Secrets as environment variables"
severity: warning
on_eval_error: error
match:
  kinds:
    - Pod
    - Deployment
    - StatefulSet
    - DaemonSet
    - ReplicaSet
    - ReplicationController
    - Job
    - CronJob
expression: |
  podContainers(resource).all(c, !((has(c.env) && c.env != null) &&
      c.env.exists(e, e != null && (has(e.valueFrom) && e.valueFrom != null && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef != null))) &&
      !((has(c.envFrom) && c.envFrom != null) &&
      c.envFrom.exists(e, e != null && (has(e.secretRef) && e.secretRef != null))))
message: "{{ .kind }}/{{ .name }} exposes a Secret to a container as an environment variable"
