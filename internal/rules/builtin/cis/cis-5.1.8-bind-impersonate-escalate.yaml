id: cis-5.1.8-bind-impersonate-escalate
description: "CIS 5.1.8: Limit use of the Bind, Impersonate and Escalate permissions in the Kubernetes cluster"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.verbs) && r.verbs != null) && ["bind", "impersonate", "escalate", "*"].exists(x, x in r.verbs))))
message: "{{ .kind }}/{{ .name }} grants the bind, impersonate or escalate verb"
