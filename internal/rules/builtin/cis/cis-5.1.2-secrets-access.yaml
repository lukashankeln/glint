id: cis-5.1.2-secrets-access
description: "CIS 5.1.2: Minimize access to secrets"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.resources) && r.resources != null) && ["secrets", "*"].exists(x, x in r.resources)) &&
      ((has(r.verbs) && r.verbs != null) && ["get", "list", "watch", "*"].exists(x, x in r.verbs))))
message: "{{ .kind }}/{{ .name }} grants get, list or watch access to secrets"
