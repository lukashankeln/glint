id: cis-5.1.9-create-persistent-volumes
description: "CIS 5.1.9: Minimize access to create persistent volumes"
severity: warning
on_eval_error: error
match:
  kinds:
    - Role
    - ClusterRole
expression: |
  !((has(resource.rules) && resource.rules != null) &&
    resource.rules.exists(r, r != null &&
      ((has(r.resources) && r.resources != null) && ["persistentvolumes", "*"].exists(x, x in r.resources)) &&
      ((has(r.verbs) && r.verbs != null) && ["create", "*"].exists(x, x in r.verbs))))
message: "{{ .kind }}/{{ .name }} grants permission to create persistent volumes"
