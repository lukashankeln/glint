id: cis-5.1.5-default-service-account
description: "CIS 5.1.5: Ensure that default service accounts are not actively used"
severity: warning
on_eval_error: error
match:
  kinds:
    - ServiceAccount
expression: |
  !((has(resource.metadata) && resource.metadata != null && has(resource.metadata.name) && resource.metadata.name != null && resource.metadata.name == "default") &&
    !(has(resource.automountServiceAccountToken) && resource.automountServiceAccountToken != null && resource.automountServiceAccountToken == false))
message: "{{ .kind }}/{{ .name }} is a default service account that does not set automountServiceAccountToken: false"
